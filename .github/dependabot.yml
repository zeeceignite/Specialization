version: 2
registries:
  core-repo:
    type: maven-repository
    url: https://maven.pkg.github.com/Emergent-Civilization/MinecraftCivilizationsCore
    username: ${{secrets.GPR_USER}}
    password: ${{secrets.GPR_KEY}}
  weight-repo:
    type: maven-repository
    url: https://maven.pkg.github.com/Emergent-Civilization/Weight
    username: ${{secrets.GPR_USER}}
    password: ${{secrets.GPR_KEY}}
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
